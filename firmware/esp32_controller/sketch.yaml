# Arduino IDE 2.x / arduino-cli build profile.
# Board options pinned to the sketch. Port is NOT pinned - it differs per
# machine, so pick it from Tools > Port.
#
# SUPERSEDED. Single-board firmware driving LEDs through the Pixelblaze Output
# Expander over UART on GPIO39. The expander is no longer in the signal path.
# Current firmware is ../../EclairTardiSplit/.
#
# Kept because it is the origin of both current sketches and still the only
# place some history lives.
#
# CDCOnBoot=cdc for consistency with the other sketches: always plug into the
# "USB" port, never "UART". (UART0 is actually free in this build.)

default_fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M,CDCOnBoot=cdc,UploadSpeed=115200
