# =============================================================================
#  ARDUINO IDE SETTINGS  —  SET THESE BY HAND, EVERY TIME
# =============================================================================
#
#  The IDE does NOT read default_fqbn at the bottom of this file. That line is
#  for arduino-cli only. Arduino's own docs say the sketch project file "isn't
#  yet fully supported in the IDE as a way to share settings configured in the
#  Tools menus".
#
#  So this block is a REFERENCE CARD, not automation. Read it, set Tools.
#
#    Board            : ESP32S3 Dev Module
#    USB CDC On Boot  : Enabled            <-- the one everyone forgets
#    PSRAM            : OPI PSRAM
#    Flash Size       : 8MB (64Mb)
#    Upload Speed     : 115200
#    Port             : Tools > Port > /dev/cu.usbmodem...
#
#    Serial Monitor   : 115200
#
#  ---------------------------------------------------------------------------
#  PLUG INTO THE SOCKET MARKED "USB", NOT "UART"
#  ---------------------------------------------------------------------------
#  The DevKitC-1 has two USB-C sockets. "UART" goes through the bridge chip on
#  GPIO43/44. With CDC On Boot enabled, serial only comes out of the native
#  "USB" one.
#
#  A BLANK SERIAL MONITOR IS ALMOST ALWAYS ONE OF THOSE TWO THINGS:
#    - USB CDC On Boot still Disabled, or
#    - cable in the UART socket.
#  Both look exactly like a crashed sketch. Check them before debugging code.
#
#  ---------------------------------------------------------------------------
#  THIS SKETCH: LCD_Driver_Test — bring-up tool, run FIRST on new hardware
#  ---------------------------------------------------------------------------
#  Libraries : FastLED (3.9 or newer)
#
#  SAFE TO RUN WITH NO LEDS ATTACHED. Every diagnostic is meaningful on a bare
#  board, and that is the best way to run it the first time.
#
#  Checks three things:
#      1. does the LCD driver actually get selected, or does it fall back to RMT
#      2. do all 8 lanes come up on the production pins
#      3. does the DMA buffer allocate at 400 px on the longest lane
#
#  Success:
#      driver : 8/8 on LCD_CLOCKLESS
#      RESULT : PASS - all lanes parallel, direct drive works
#
#  Brightness is capped at 12/255 and 1.5 A. Safe on a bench supply.
#
# =============================================================================
# For arduino-cli only. Ignored by the IDE.
default_fqbn: esp32:esp32:esp32s3:PSRAM=opi,FlashSize=8M,CDCOnBoot=cdc,UploadSpeed=115200
